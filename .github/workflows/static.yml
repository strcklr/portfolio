# Builds chasestrickler.com from the public resume and deploys it to GitHub Pages.
name: Build and deploy to Pages

on:
  push:
    branches: ["main"]
  pull_request: # build only, as a check; never deploys
  workflow_dispatch:
  schedule:
    # Nightly, so resume edits and role durations ("2 yr 3 mo") stay current
    # without the resumes repo needing write access here.
    - cron: "17 9 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v4

      # The resumes repo is private. RESUMES_TOKEN is a fine-grained token with
      # read-only "Contents" access to strcklr/resumes and nothing else.
      - name: Checkout resumes
        uses: actions/checkout@v4
        with:
          repository: strcklr/resumes
          token: ${{ secrets.RESUMES_TOKEN }}
          path: resumes
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pango (for the PDF)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0

      - name: Install build dependencies
        run: pip install -r requirements.txt

      - name: Build site
        run: python build.py resumes/resumes/tailored/public.yml --out _site

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
